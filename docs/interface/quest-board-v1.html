<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Quest Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --stone-0:#0e0a07; --wood-0:#2b1d13; --wood-1:#3d2a1a;
  --parch:#f0e4c6; --parch-2:#e0cfa8;
  --gold:#eec269; --gold-deep:#b8862c; --gold-dim:#9c7630;
  --violet:#b79ef0; --violet-deep:#6b4cba;
  --iron:#cbbda4; --iron-edge:#6d5a3e;
  --ink:#2a1d10; --ink-2:#54402a;
}
*{box-sizing:border-box}
html{font-size:16px}
body{
  margin:0; min-height:100vh; color:var(--parch);
  font-family:'EB Garamond',Georgia,'Times New Roman',serif;
  background:
    radial-gradient(130% 85% at 50% -12%, #432d1a 0%, transparent 62%),
    radial-gradient(55% 45% at 6% 34%, rgba(255,150,60,.16) 0%, transparent 70%),
    radial-gradient(48% 40% at 94% 52%, rgba(150,115,240,.14) 0%, transparent 70%),
    linear-gradient(180deg,#1f150e 0%, var(--stone-0) 100%);
  background-color:var(--stone-0);
}
.room{max-width:1680px;margin:0 auto;padding:22px 26px 54px}

/* ══ PANEL — the character-sheet idea: every region is its own framed box.
      Separation comes from structure, never from dimming something out. ══ */
.panel{
  border:2px solid var(--gold-deep); border-radius:5px;
  background:linear-gradient(180deg, rgba(38,26,16,.94), rgba(20,13,8,.96));
  box-shadow:0 10px 26px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,225,170,.07);
}
.panel > .cap{
  display:block; padding:6px 12px; text-align:center;
  background:linear-gradient(180deg,#4a3468,#2c1f42);
  border-bottom:2px solid var(--gold-deep);
  font-family:'Cinzel',Georgia,serif; font-size:.72rem; font-weight:600;
  letter-spacing:.17em; text-transform:uppercase; color:var(--gold);
}
.panel > .body{padding:13px}
.panel.violet{border-color:var(--violet-deep)}
.panel.violet > .cap{background:linear-gradient(180deg,#3d2d63,#241a3d);
  border-bottom-color:var(--violet-deep);color:var(--violet)}
.panel.iron{border-color:var(--iron-edge)}
.panel.iron > .cap{background:linear-gradient(180deg,#3a2f22,#221a11);
  border-bottom-color:var(--iron-edge);color:#d9c8a4}

/* --rail is what the grip drags. Media queries below set the DEFAULT for a
   given window; an inline --rail set by the grip beats them, which is exactly
   the precedence we want -- Ernie's choice outranks the guess. */
.board{--rail:272px; display:grid; gap:14px;
  grid-template-columns:minmax(0,1fr) 9px var(--rail); align-items:start}

/* ══ THE GRIP ══ drag to trade the rail against the board. Double-click resets.
   Three iron ridges, no label: it looks like something you take hold of. */
.grip{align-self:stretch;min-height:220px;position:relative;cursor:col-resize;
  border-radius:3px;background:linear-gradient(180deg,#2e2114,#170f08);
  border:1px solid #4a3a24;touch-action:none;transition:border-color .2s}
.grip:hover,.grip.live{border-color:var(--gold-deep)}
.grip:after{content:"";position:absolute;left:50%;top:50%;width:1px;height:26px;
  transform:translate(-50%,-50%);
  background:linear-gradient(180deg,transparent,#8d7448 22%,#8d7448 78%,transparent);
  box-shadow:-2px 0 0 #6d5836,2px 0 0 #6d5836}
.grip.live:after{box-shadow:-2px 0 0 var(--gold-deep),2px 0 0 var(--gold-deep)}
@media (max-width:1020px){ .grip{display:none} }
/* Default rail width per window size. These are only starting points now --
   the grip overrides any of them, and Ernie's setting is remembered. */
@media (max-width:1430px){
  .board{--rail:236px; gap:12px}
  .room{padding-left:14px;padding-right:14px}
}
/* Measured: at 1340px the longest project title needed 36px more than a log
   column had. The rail pays it, not the title. */
@media (max-width:1364px){
  .board{--rail:196px; gap:10px}
  .log{gap:12px} .log > .col{gap:12px}
}
@media (max-width:1020px){ .board{grid-template-columns:1fr} }

/* ══ THE SIGN ══ The house name, hung over the whole room. It replaces the
   space Ed's full portrait used to eat: he is a regular now, not a billboard. */
.sign{
  position:relative;margin:0 0 16px;max-width:500px;padding:8px 26px;
  text-align:center;border-radius:3px;
  background:linear-gradient(180deg,#3a2818,#1d130b);
  border:1px solid var(--gold-deep);
  box-shadow:0 10px 26px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,220,160,.16);
}
.sign h1{margin:0;font-family:'Cinzel',Georgia,serif;font-weight:600;
  font-size:1.12rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.8)}
/* the two hanging eyelets, so it reads as hung rather than printed */
.sign:before,.sign:after{content:"";position:absolute;top:-5px;width:9px;height:9px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6c073,#6d4d16);
  box-shadow:0 1px 4px rgba(0,0,0,.8)}
.sign:before{left:24px}.sign:after{right:24px}

/* ══ ED ══ a profile, not a portrait. Portrait, bell and sign sit on one row;
   his speech scroll -- the one thing on the board that gives an instruction --
   keeps its full width underneath, because that is the part that does the work. */
.ed{display:flex;align-items:center;gap:14px}
.ed .frame{flex:0 0 auto;width:104px}
.ed .bell{position:static;width:52px;height:52px;flex:0 0 auto}
.ed .bell svg{width:27px;height:32px}
.frame{
  position:relative;
  border:5px solid transparent; border-radius:4px;
  background:linear-gradient(#000,#000) padding-box,
    linear-gradient(150deg,var(--gold),#6d4d19 42%,var(--gold) 72%,#4a340f) border-box;
  box-shadow:0 12px 32px rgba(0,0,0,.78); line-height:0;
}
/* ed-square.png is cropped from INSIDE ed.png's own painted gold border --
   squaring the original in CSS cut that border in half and read as damage.
   The frame around him is .frame's, and it closes properly. */
.frame img{width:100%;height:auto;display:block}
.scroll{
  position:relative; margin-top:13px; padding:12px 14px;
  background:linear-gradient(170deg,#f4e9cd,#e2d2ac); color:var(--ink);
  border-radius:4px; border:1px solid #9a7c45;
  box-shadow:0 10px 26px rgba(0,0,0,.6), inset 0 0 46px rgba(150,110,50,.16);
  font-size:.88rem; line-height:1.5;
}
.scroll:after{content:"";position:absolute;left:34px;top:-11px;
  border:11px solid transparent;border-bottom-color:#f4e9cd;border-top:0}

/* The bell hangs on Ed's own frame, bottom right. No label -- the bell is the
   label. It sits on a dark plaque with a gold rim so it reads against whatever
   part of the tavern is behind it (rule 5a: if she can't see it, it won't get
   used), and the bell itself is gold rather than the wall's brown. */
.bell{position:absolute;right:15px;bottom:15px;z-index:2;
  display:grid;place-items:center;width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle at 38% 28%,rgba(34,24,14,.93),rgba(9,6,3,.97));
  border:1px solid var(--gold-deep);text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,220,160,.2);
  transition:border-color .25s,box-shadow .25s,transform .15s}
.bell:hover{border-color:var(--gold);transform:translateY(-1px);
  box-shadow:0 9px 24px rgba(0,0,0,.85), 0 0 20px rgba(255,180,90,.42),
    inset 0 1px 0 rgba(255,220,160,.3)}
.bell:active{transform:translateY(0)}
.bell svg{width:35px;height:41px;display:block;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.85))}


/* ══ THE SPILL ══ A thought goes in whatever shape it arrives in. Ed sorts it. */
.spill{margin-top:20px}
.spill .cap{display:block;margin-bottom:10px;text-align:center;
  font-family:'Cinzel',Georgia,serif;font-size:.76rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-dim)}
.spill textarea{
  display:block;width:100%;box-sizing:border-box;min-height:74px;resize:vertical;
  padding:10px 12px;border-radius:4px;border:1px solid #9a7c45;
  background:linear-gradient(170deg,#f4e9cd,#e2d2ac);color:var(--ink);
  font-family:'EB Garamond',Georgia,serif;font-size:.94rem;line-height:1.42;
  box-shadow:0 8px 20px rgba(0,0,0,.55), inset 0 0 34px rgba(150,110,50,.14)}
.spill textarea::placeholder{color:#9a875f;font-style:italic}
.spill textarea:focus{outline:none;border-color:var(--gold-deep);
  box-shadow:0 8px 20px rgba(0,0,0,.55), inset 0 0 34px rgba(150,110,50,.2),
    0 0 0 2px rgba(190,150,70,.28)}
.spill .drop{
  display:block;width:100%;margin-top:12px;padding:8px 0;cursor:pointer;
  border-radius:3px;background:linear-gradient(180deg,#2c2015,#150e08);
  border:1px solid #6a5231;color:var(--gold-dim);
  font-family:'Cinzel',Georgia,serif;font-size:.78rem;letter-spacing:.2em;
  transition:color .25s,border-color .25s}
.spill .drop:hover{color:var(--gold);border-color:var(--gold-deep)}

/* ══ MAIN QUEST ══ */
.mainquest{
  position:relative;display:flex;align-items:center;gap:18px;padding:13px 34px 13px 20px;
  background:linear-gradient(165deg,#f4eacb 0%,#e3d2a9 55%,#d1bc8c 100%);
  color:var(--ink);border-radius:4px;
  box-shadow:0 16px 38px rgba(0,0,0,.72), inset 0 0 66px rgba(150,110,50,.18);
}
.mainquest h1{margin:0;font-family:'Cinzel',Georgia,serif;font-weight:700;
  font-size:1.3rem;line-height:1.14;color:#3a2a5c;flex:1}
/* label-above-value, straight off the character sheet */
.stat{flex:0 0 auto;text-align:center;padding:0 20px;
  border-left:1px solid rgba(90,65,25,.32);border-right:1px solid rgba(90,65,25,.32)}
.stat .lab{display:block;font-family:'Cinzel',Georgia,serif;font-size:.76rem;
  letter-spacing:.19em;text-transform:uppercase;color:var(--ink-2)}
.stat .val{display:block;margin-top:2px;font-family:'Cinzel',Georgia,serif;
  font-size:1.6rem;line-height:1;color:var(--ink);font-weight:600}
.coin{flex:0 0 auto;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#f8dd93,#daa740 45%,#8f6a1c 100%);
  box-shadow:0 7px 18px rgba(0,0,0,.5),inset 0 -5px 14px rgba(90,60,10,.6),
    inset 0 3px 9px rgba(255,240,190,.55);
  display:grid;place-items:center;color:#7a5715;font-size:1.35rem}
.nail{position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e6c073,#6d4d16);
  box-shadow:0 1px 4px rgba(0,0,0,.7)}
.nail{width:9px;height:9px}
.nail.tl{left:9px;top:9px}.nail.tr{right:9px;top:9px}
.nail.bl{left:9px;bottom:9px}.nail.br{right:9px;bottom:9px}

/* ══ QUEST LOG ══ */
/* Two independent columns, not a grid of equal-height rows. A short panel
   stops where its content stops and the panel under it moves up to meet it. */
.log{margin-top:16px;display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:start}
.log > .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.log > .panel.wide{grid-column:span 2}
/* On a genuinely narrow window two columns stop being readable at all, so the
   log folds to one. Nothing to do with wrapping any more -- that is Ernie's call
   via the grip. This block must stay BELOW the base .log rule: same specificity,
   so source order decides, and an identical query placed above it silently
   loses. That bug cost a round trip; leave it here. */
@media (max-width:1318px){
  .log{grid-template-columns:1fr}
  .log > .panel.wide{grid-column:span 1}
}
.panel .body.stack{display:flex;flex-direction:column;gap:10px}

.note{position:relative;display:flex;align-items:center;gap:14px;
  padding:9px 13px 9px 31px;text-align:left;border-radius:3px;
  font-size:.92rem;line-height:1.5;box-shadow:0 6px 13px rgba(0,0,0,.48)}
/* Text WRAPS. It may never be hidden.
   The earlier rule was no-wrap-ever, which was the layout deciding for Ernie.
   With the grip she decides: drag the rail in to give a long title one line, or
   out to see more of the rail and let it take two. What does NOT move is that
   nothing is ever truncated -- no ellipsis, no clipping, no hidden overflow on a
   title. A wrapped title still shows every word; a truncated one does not, and
   if she cannot see it, it will not get done. */
.note .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.note .pin{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#cdb8f5,#4a3480);
  box-shadow:0 2px 5px rgba(0,0,0,.7)}

.note.main{background:linear-gradient(165deg,#f4ead0,#e2d2ac);color:var(--ink);
  padding-left:47px;font-size:.98rem;border:1px solid #a5854b}
.note.main .seal{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f6da8c,#c08f2c 55%,#7d5a13);
  box-shadow:0 4px 10px rgba(0,0,0,.65),inset 0 -2px 7px rgba(80,55,10,.7);
  display:grid;place-items:center;color:#6d4d12;font-size:.85rem}

.note.side{background:linear-gradient(160deg,#ece0bd,#d8c59c);color:var(--ink);
  border:1px solid #9c7f4a}

/* Dailies and repeatables are NOT dimmed. Different material, same legibility —
   if she can't see it, it won't get done. */
.note.daily{background:linear-gradient(165deg,#4a3d2c,#372c1f);color:var(--iron);
  border:1px solid var(--iron-edge)}
.note.rep{background:linear-gradient(165deg,#4a3d2c,#372c1f);color:var(--iron);
  border:1px solid var(--iron-edge)}
.note.daily .pin,.note.rep .pin{
  background:radial-gradient(circle at 34% 30%,#c3b092,#4b3d28)}
.note.rep{padding-left:33px}
.note.rep .cycle{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--gold-dim);font-size:1.02rem}
.note.rep .pin{display:none}

.note.main .thread{font-family:'Cinzel',Georgia,serif;
  font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  color:#7d5d1d;margin-right:10px}
.note.main .thread:after{content:"\00b7";margin-left:10px;color:#ab9159}

.note.major{display:block;background:linear-gradient(165deg,#443661,#2f2547);
  color:#ded2f5;border:1px solid var(--violet-deep);padding:9px 14px}
.note.major .head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.note.major .head .status{margin-left:auto}
.note.major .thread{font-family:'Cinzel',Georgia,serif;
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.note.major .txt{display:block;font-size:.96rem;line-height:1.3}
.note.major .tally{display:block;margin-top:4px;text-align:right;
  font-family:'Cinzel',Georgia,serif;
  font-size:.66rem;letter-spacing:.12em;color:#bcaae6}

.note .status{flex:0 0 auto;margin-top:0;padding:3px 9px;border-radius:2px;white-space:nowrap;
  font-family:'Cinzel',Georgia,serif;font-size:.64rem;letter-spacing:.13em;
  text-transform:uppercase;line-height:1.6;
  background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);color:#a89b82}
.note.main .status,.note.side .status{
  background:rgba(90,65,25,.13);border-color:rgba(120,90,40,.4);color:#75592c}
.note.major .status{background:rgba(120,95,200,.2);
  border-color:rgba(160,130,240,.4);color:#c4b1f2}
.note.daily .status,.note.rep .status{color:#c4b391;border-color:rgba(200,180,140,.24)}

/* ══ AGING ══ the only signal this board gives that time has passed.
   CONTINUOUS, not stepped (2026-08-23). `sat` is a real number 0-3 and the
   renderer interpolates straight off it, so a note that has sat nine days does
   not look identical to one that has sat fourteen. The thresholds Ernie chose
   still mean what they meant -- fill_board.py bends the day count so sat lands
   on exactly 1.0, 2.0 and 3.0 at them.
   Tone is a WARMTH shift, never a brightness drop. The old rule dimmed instead:
   sepia+brightness on already-sepia parchment moved warmth 4 points, less than
   the panel's own gradient, and age3 came out LESS warm than age2. Measured,
   not eyeballed. Rule 5a also forbids fading anything Ernie has to read --
   text contrast measured at every level, 11:1 fresh through 12.9:1 worn. */
.note{overflow:hidden}
/* Tone is a WARMTH shift, never a brightness drop. The old rule dimmed instead
   -- sepia+brightness on already-sepia parchment moved warmth by 4 points, less
   than the panel's own gradient, and age3 came out LESS warm than age2. Measured
   2026-08-23, not eyeballed. Rule 5a also forbids fading anything Ernie reads.
   Text contrast measured at every level: 11:1 fresh, 12.8:1 at age3. */
/* The lifting corner. Size rides --corner, set inline from the same number as
   the tone, so paper and fold age together instead of in three jumps. */
.note:after{content:"";position:absolute;right:0;bottom:0;pointer-events:none;
  width:var(--corner,0);height:var(--corner,0);
  background:linear-gradient(135deg,transparent 50%,rgba(125,95,50,.42) 50%,rgba(55,38,16,.72) 100%)}

.more{display:block;text-align:center;font-size:.88rem;font-style:italic;
  color:#9b8666;text-decoration:underline;text-underline-offset:4px}

/* ══ THE LISTENER ══ */
.lswrap{text-align:center}
/* Square crop so the notepad above it has room. object-fit keeps the crystal
   centred rather than squashing it. */
.lswrap img{width:100%;max-width:150px;height:150px;object-fit:cover;
  object-position:50% 42%;border-radius:3px}
.dark img{filter:grayscale(.9) brightness(.34)}
.lssay{margin-top:10px;font-size:.86rem;font-style:italic;color:#cbb894;line-height:1.4}
.foot{margin-top:34px;text-align:center;color:#7d6950;font-size:.86rem;letter-spacing:.06em}
.rail > * + *{margin-top:18px}
</style>
</head>
<body>
<div class="room">

<div class="board">

  <!-- ═══ CENTRE ═══ the sign hangs at the left, over the work itself ═══ -->
  <div>
    <header class="sign"><h1>Ed's Tavern &amp; Haberdashery</h1></header>

    <div class="panel">
      <span class="cap">The Main Quest</span>
      <div class="body" style="padding:0">
        <div class="mainquest">
          <span class="nail tl"></span><span class="nail tr"></span>
          <span class="nail bl"></span><span class="nail br"></span>
          <h1 id="mqTitle"></h1>
          <div class="stat">
            <span class="lab">Days Remaining</span>
            <span class="val" id="mqDays"></span>
          </div>
          <div class="coin">♔</div>
        </div>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="grip" id="grip" role="separator" aria-orientation="vertical"
       tabindex="0" aria-label="Drag to resize the rail; double-click to reset"
       title="Drag to resize · double-click to reset"></div>

  <!-- ═══ THE RAIL ═══ Ed, then his line, then capture, then the Listener.
       Top to bottom this is one loop: he tells you the thing, you dump whatever
       the thing knocked loose, and the crystal says whether it still needs
       filing. The Shield came out on 2026-08-23 — good idea, not yet earned its
       space, and if it is never missed it was never necessary. ═══ -->
  <div class="rail">
    <div class="ed">
      <div class="frame">
        <img id="edimg" src="assets/ed-square.png" alt="Ed, the innkeeper, behind his bar">
      </div>
      <a class="bell" id="bell" href="claude://" title="Ring for Ed" aria-label="Ring for Ed">
        <svg width="86" height="98" viewBox="0 0 74 86" aria-hidden="true">
          <path d="M12 24 H62" stroke="#a8842f" stroke-width="4" stroke-linecap="round"/>
          <path d="M37 24 v6" stroke="#8d6c26" stroke-width="3"/>
          <path d="M37 30 c-14 0 -22 12 -22 26 v8 h44 v-8 c0 -14 -8 -26 -22 -26 z"
                fill="url(#ir)" stroke="#241a10" stroke-width="1.5"/>
          <rect x="11" y="63" width="52" height="6" rx="3" fill="#a8842f" stroke="#241a10"/>
          <circle cx="37" cy="74" r="5" fill="#c9973c" stroke="#241a10"/>
          <defs><linearGradient id="ir" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f2d79a"/><stop offset=".45" stop-color="#c9973c"/>
            <stop offset="1" stop-color="#7d5a18"/></linearGradient></defs>
        </svg>
      </a>
    </div>

    <div class="scroll" id="edline"></div>

    <div class="spill">
      <span class="cap">Add to Vault</span>
      <textarea id="spillbox" rows="3"
        placeholder="Whatever just crossed your mind. Shape doesn't matter."></textarea>
      <button class="drop" id="drop" type="button">Drop it</button>
    </div>

    <div class="panel violet" id="listener">
      <span class="cap">The Listener</span>
      <div class="body lswrap">
        <img id="lsimg" src="assets/listener.png" alt="The Listener, a faceted crystal on silver chains">
        <div class="lssay" id="lssay"></div>
      </div>
    </div>
  </div>

</div>
<div class="foot">Good ale. Warm beds. Bad excuses.</div>
</div>

<script src="board-data.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   THE SEAM. Everything below is placeholder. When the board goes
   live this object is what ClickUp and Airtable fill in — nothing
   else in the page needs to change.
   ══════════════════════════════════════════════════════════════ */
const BOARD = {
  mainQuest: { title: "Close the Books by the 15th", daysRemaining: 10 },
  ed: "Bank feeds, then. Pull the latest transactions and I'll leave you alone.",
  listener: { waiting: true, line: "A record is waiting to be triaged." },

  quests: [
    // sat = wear, a CONTINUOUS number 0-3. NOT a day count — fill_board.py
    // bends days-untouched onto this scale, on a clock that differs per column,
    // so 1.0 / 2.0 / 3.0 land on the thresholds Ernie chose. Rendered as wear
    // ONLY: never printed, never counted, never turned back into a date.
    { type:"main",  text:"Close the month — July 2026",           status:"In Progress", sat:0 },
    { type:"main",  text:"Review &amp; reconcile all accounts", status:"Open",        sat:0 },
    { type:"main",  text:"Finalize &amp; archive July 2026",                          sat:0 },

    // Major: ONE note per project — its latest open task. Where every build
    // currently stands, at a glance. Not a task list.
    { type:"major", thread:"Diane",   text:"Ticket OCR validation pass", status:"In Progress", sat:1 },
    { type:"major", thread:"Ed",      text:"Wire the board to ClickUp",  status:"In Progress", sat:0 },
    { type:"major", thread:"Portal",  text:"Client hubs, phase 2",       status:"Blocked",     sat:2 },
    { type:"major", thread:"Kwisatz", text:"Rebuild app.py",             status:"Parked",      sat:3 },

    { type:"side",  text:"Clean up old categories",  status:"Open",        sat:3 },
    { type:"side",  text:"Update vendor records",    status:"In Progress", sat:1 },
    { type:"side",  text:"Refine reports packages",                        sat:1 },

    { type:"daily", text:"Check for new transactions", sat:0 },
    { type:"daily", text:"Triage the night\u2019s record",         sat:0 },
    { type:"daily", text:"Client follow-up sweep",     sat:0 },

    { type:"rep",   text:"Weekly invoice run",  sat:0 },
    { type:"rep",   text:"Payroll check-in",    sat:0 },
    { type:"rep",   text:"Vendor maintenance",  sat:1 }
  ]
};

/* The seam, filled. board-data.js is written by fill_board.py from ClickUp.
   Absent, the placeholder above stands and the page still opens. */
if (window.BOARD_DATA) Object.assign(BOARD, window.BOARD_DATA);


/* How many projects show. The rest live in the ledger — a detail page, later.
   Three is the cap because the column is a glance, not an index. */
const MAJOR_SHOWN = 3;

/* Two rows of wide panels rather than five narrow ones — a note needs room to
   be a sentence, not a stack of two words. 6-col grid: 2+2+2 then 3+3. */
/* [type, heading, tone, where] — 'a' and 'b' are the two columns, 'wide' spans. */
const COLS = [
  ["main",  "Main Quest Line",   "",      "a"],
  ["major", "Major Quest Lines", "violet","a"],
  ["side",  "Side Quests",       "",      "b"],
  ["daily", "Dailies",           "iron",  "b"],
  ["rep",   "Repeatables",       "iron",  "b"]
];

document.getElementById('mqTitle').innerHTML = BOARD.mainQuest.title.replace(/\n/g,'<br>');
document.getElementById('mqDays').textContent = BOARD.mainQuest.daysRemaining;
document.getElementById('edline').innerHTML = BOARD.ed.replace(/\n/g,'<br>');

document.getElementById('lssay').textContent = BOARD.listener.line;
if (!BOARD.listener.waiting) document.getElementById('listener').classList.add('dark');

const log = document.getElementById('log');
const colA = document.createElement('div'); colA.className = 'col';
const colB = document.createElement('div'); colB.className = 'col';

for (const [type, head, tone, where] of COLS) {
  let items = BOARD.quests.filter(q => q.type === type);
  let overflow = false;
  if (type === 'major' && items.length > MAJOR_SHOWN) {
    items = items.slice(0, MAJOR_SHOWN); overflow = true;
  }
  const panel = document.createElement('div');
  panel.className = 'panel' + (tone ? ' ' + tone : '');
  const body = document.createElement('div');
  body.className = 'body stack';
  for (const q of items) {
    // Wear rides ONE continuous number so tone and fold age together. The
    // coefficients are set so w=1/2/3 land on the three tones that were
    // measured: warmth +67, +79, +94 against a fresh note's +52.
    const w = Math.max(0, Math.min(3, +q.sat || 0));
    const n = document.createElement('div');
    n.className = 'note ' + type;
    if (w > 0) {
      n.style.filter = 'sepia(' + (0.24 * w).toFixed(3) + ') saturate(' +
        (1 + 0.15 * w).toFixed(3) + ') hue-rotate(' + (-4.3 * w).toFixed(2) + 'deg)';
      n.style.setProperty('--corner', (3.5 + 10.8 * w).toFixed(1) + 'px');
      // Past w=2 parchment stops taking sepia, so the last stretch is carried by
      // what actually happens to old paper: the edges brown first. The middle,
      // where the words are, stays clean.
      if (w > 2) n.style.boxShadow =
        'inset 0 0 20px -4px rgba(92,60,24,' + (0.55 * (w - 2)).toFixed(2) +
        '), 0 6px 13px rgba(0,0,0,.48)';
    }
    if (type === 'major') {
      // Project, then its status, then the task, then how far the line has come.
      // Stacked rather than run together: the task gets a full line to itself,
      // which is the only way a real project title fits without wrapping.
      n.innerHTML =
        '<span class="head">' +
          '<span class="thread">' + (q.thread || '') + '</span>' +
          (q.status ? '<span class="status">' + q.status + '</span>' : '') +
        '</span>' +
        '<span class="txt">' + q.text + '</span>' +
        (q.tally ? '<span class="tally">' + q.tally + '</span>' : '');
    } else {
      n.innerHTML =
        (type === 'main' ? '<span class="seal">♚</span>' : '<span class="pin"></span>') +
        (type === 'rep' ? '<span class="cycle">↻</span>' : '') +
        '<span class="txt">' + q.text + '</span>' +
        (q.status ? '<span class="status">' + q.status + '</span>' : '');
    }
    body.appendChild(n);
  }
  if (overflow) {
    const m = document.createElement('a');
    m.className = 'more'; m.href = '#';
    m.textContent = 'the rest are in the ledger';
    body.appendChild(m);
  }
  panel.innerHTML = '<span class="cap">' + head + '</span>';
  panel.appendChild(body);
  (where === 'a' ? colA : where === 'b' ? colB : log).appendChild(panel);
}
// The two half-width columns sit under whatever wide panels were emitted above.
log.appendChild(colA); log.appendChild(colB);

/* The bell is a plain link to a bare claude:// — verified to bring the app
   forward WITHOUT touching the open conversation. Nothing on this board starts
   a new conversation. The bell is its own label: ringing it IS the gesture,
   so the clipboard hand-off that used to sit under it came out on 2026-08-23. */

/* ══ THE GRIP ══ trade rail width against board width, by hand.
   Ernie's rule, revised 2026-08-23: wrapping is fine BECAUSE this exists. She
   moves the board between screens and trades width by hand -- rail in for a long
   title on one line, rail out to see more of Ed and the vault. The board no
   longer second-guesses her. The one hard floor is that the rail must stay wide
   enough to hold Ed and his bell side by side. */
const board = document.querySelector('.board');
const grip  = document.getElementById('grip');
const RAIL_MIN = 176, RAIL_MAX = 620, RAIL_KEY = 'questboard.rail';

function setRail(px, remember) {
  const w = Math.round(Math.min(RAIL_MAX, Math.max(RAIL_MIN, px)));
  board.style.setProperty('--rail', w + 'px');
  // Storage is a convenience, never a dependency: opened from a preview pane it
  // can throw or come back empty, and the board must not care.
  if (remember) { try { localStorage.setItem(RAIL_KEY, w); } catch (e) {} }
  return w;
}

try {
  const saved = parseInt(localStorage.getItem(RAIL_KEY), 10);
  if (saved) setRail(saved, false);
} catch (e) {}

let dragging = false;
grip.addEventListener('pointerdown', e => {
  dragging = true; grip.classList.add('live');
  grip.setPointerCapture(e.pointerId); e.preventDefault();
});
grip.addEventListener('pointermove', e => {
  if (!dragging) return;
  // Rail runs from the pointer to the right edge of the board.
  setRail(board.getBoundingClientRect().right - e.clientX, false);
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false; grip.classList.remove('live');
  try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
  const cur = parseInt(getComputedStyle(board).getPropertyValue('--rail'), 10);
  if (cur) setRail(cur, true);
}
grip.addEventListener('pointerup', endDrag);
grip.addEventListener('pointercancel', endDrag);

/* Double-click hands the width back to the media queries. */
grip.addEventListener('dblclick', () => {
  board.style.removeProperty('--rail');
  try { localStorage.removeItem(RAIL_KEY); } catch (e) {}
});

/* Keyboard, because a 9px target is a rough click on a bad day. */
grip.addEventListener('keydown', e => {
  const step = e.shiftKey ? 40 : 12;
  const cur = parseInt(getComputedStyle(board).getPropertyValue('--rail'), 10) || 272;
  if (e.key === 'ArrowLeft')  { setRail(cur + step, true); e.preventDefault(); }
  if (e.key === 'ArrowRight') { setRail(cur - step, true); e.preventDefault(); }
});

/* THE SPILL. The board holds no credentials and reaches nothing on its own --
   same rule as the bell. So "Drop it" copies the thought as an instruction and
   rings Ed, and Ed is the one who writes it to Admin > Inbox. Ernie spills;
   Ed sorts. Wiring this straight into ClickUp means a token, and a token means
   the local caller, not this file. */
const SPILL_PREFIX = "File this in ClickUp under Admin > Inbox, exactly as written: ";
const spillbox = document.getElementById('spillbox');
const drop = document.getElementById('drop');
drop.addEventListener('click', async () => {
  const thought = spillbox.value.trim();
  if (!thought) { spillbox.focus(); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(SPILL_PREFIX + thought); ok = true; }
  catch (e) {
    try {
      const t = document.createElement('textarea');
      t.value = SPILL_PREFIX + thought; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.select();
      ok = document.execCommand('copy'); document.body.removeChild(t);
    } catch (e2) { ok = false; }
  }
  if (ok) {
    spillbox.value = '';
    drop.textContent = 'Copied — ring Ed and paste';
    window.location.href = 'claude://';
  } else {
    drop.textContent = 'Copy failed — keep the text';
  }
  setTimeout(() => { drop.textContent = 'Drop it'; }, 3000);
});
</script>
</body>
</html>
